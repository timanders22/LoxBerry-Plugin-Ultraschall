; Ultraschall Entfernung
; Wird von der Plugin-Oberflaeche geschrieben.
;
; Diese Datei liegt dem Paket bei, damit die Voreinstellungen von Anfang an
; feststehen. Ohne sie muesste man erst einmal speichern, bevor der Dienst
; etwas Sinnvolles tut.

[ultraschall]
enabled=0
sensor=srf02
i2c_bus=1
i2c_adresse=0x70
gpio_trigger=23
gpio_echo=24
messungen=5
messabstand=0.2
min_cm=3
max_cm=400
offset_cm=0
leer_cm=
voll_cm=
volumen_liter=
intervall=60
aktualisierung=300
themenpraefix=ultraschall
mqtt=1
udp=0
udp_miniserver=1
udp_port=
