[AUTHOR]
# ACHTUNG: NAME und EMAIL sind die KENNUNG dieses Plugins fuer LoxBerry, kein
# Urhebervermerk. Nach der ersten Veroeffentlichung nicht mehr aendern - sonst
# gilt es als anderes Plugin und jedes Update schlaegt fehl.
#
# Sie benennen den Herausgeber DIESES Pakets, nicht den des Originals.
# Der urspruengliche Autor steht in README.md und im Kopf der Quelldateien -
# LoxBerry bildet aus Name, E-Mail und Plugin-Name den Schluessel, unter dem
# es das Plugin fuehrt; bliebe hier der fremde Name stehen, waere die
# Abspaltung fuer LoxBerry dasselbe Plugin wie das Original.
NAME=Ultraschall Plugin Authors
EMAIL=ultraschall@users.noreply.github.com

[PLUGIN]
VERSION=1.1.9
NAME=ultraschall
FOLDER=ultraschall
TITLE=Ultraschall Entfernung

[SYSTEM]
# Die Originalfassung stand auf INTERFACE=1.0. sbin/plugininstall.pl lehnt
# das seit LoxBerry 2 rundheraus ab (ERR_INTERFACENOTSUPPORTED) - das Plugin
# liess sich auf LoxBerry 3 und 4 gar nicht erst installieren. Das war der
# eigentliche Grund fuer den Umbau.
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Ohne Architekturbindung. Der I2C-Weg laeuft auf jedem Rechner mit I2C-Bus,
# der GPIO-Weg braucht einen Raspberry Pi - das faellt aber erst beim
# Einrichten auf und soll die Installation nicht verhindern.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Beide URLs zeigen auf diese Fortfuehrung, nicht auf das Original. Das
# Originalplugin hatte gar keinen AUTOUPDATE-Abschnitt.
AUTOMATIC_UPDATES=true

RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Ultraschall/main/release.cfg

PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Ultraschall/main/prerelease.cfg
