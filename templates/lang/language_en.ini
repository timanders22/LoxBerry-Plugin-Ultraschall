ULTRASCHALL_MISST_DIE_LAUFZEIT_EIN = "Ultrasound measures the transit time of a sound echo. This works well against flat, hard, horizontal surfaces &mdash; water, concrete, sheet metal. It works poorly against foam, bulk goods with sloping surfaces, textiles and anything that scatters sound instead of reflecting it. If the sensor is in a narrow pipe, echoes from the pipe wall are included."
