[THEMA_LANG]
DISTANCE = "Distance from the sensor to the surface, in centimetres."
LAST_ERROR = "Last error message, otherwise empty. <b>No virtual input</b> — the gateway creates text topics itself on first receipt."
LEVEL = "Level in percent — only with calibration entered, otherwise empty."
LITER = "Content in litres — only with a total volume entered, otherwise empty."
ONLINE = "1 as long as the service is running. It sends this on every cycle; if the process dies, the broker sets it to 0 through the last will, and when stopped the service sends the 0 itself. The only retained topic. <b>Not</b> to be confused with <span class='sm-mono'>OK</span> and <span class='sm-mono'>ONLINE</span> in the endpoint response line — the endpoint derives those from the age of <span class='sm-mono'>TS</span>, so they say whether the VALUE is current. Over MQTT, <span class='sm-mono'>TS</span> answers that itself."
TS = "Time of the last <b>successful</b> reading as Unix time. In Loxone the age is <span class='sm-mono'>(Loxone time + 1230768000) - TS</span>."
VALID = "1 if the last cycle produced a usable value, otherwise 0."
ZAEHLER = "Advances by one on every cycle, 0 to 999, then starts over. A block watching for <i>unchanged for N minutes</i> detects a stalled service this way — even if the clock of the machine jumps. Over MQTT the first value sent is 0; the −1 for <i>never run yet</i> only appears in the endpoint response line, and only while there is no state file."

