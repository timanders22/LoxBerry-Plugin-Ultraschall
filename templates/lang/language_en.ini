B36_VERB = "Input = #35"
UE_TITEL = "Fill level, consumption and notifications"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
TYP_VI = "Virtual input (name as the MQTT gateway assigns it, plugin Ultraschall)"
S1 = "In the plugin, tab %s: choose the sensor, tick %s and save. Then calibrate: with the tank empty press %s, with the tank full %s (or enter both distances in cm), enter %s and save. Without calibration fill level and litres send −1 (no statement) – then only distance, sensor and failure notification work, and the dry-run protection locks. Tab %s → %s: a plausible distance must come."
S2 = "LoxBerry → MQTT Gateway: version 1 – enter the subscription %s (shown above in step&nbsp;2). Version 2 – in the subscriptions under %s tick the seven data points from step&nbsp;2, valid and online with “Noncached”."
S3 = "Create virtual inputs (Periphery → Virtual Inputs → Virtual input), names exactly as in the name table (step&nbsp;3): %s, %s, %s, %s, %s and %s. Do not tick “Use as digital input”. There is no template to import for this."
S4 = "Create a virtual text input: Periphery → Virtual Inputs → Virtual text input, name exactly: %s, “Use in visualisation” on."
S5 = "Create the page “Ultraschall”, drag the six inputs, the text input and a constant with value 1 onto the page. For %s and %s switch on “Statistics” in the properties window."
S6 = "Create five notifications (Periphery → Messages → Notification): “Füllstand niedrig”, “Ultraschall ausgefallen”, “Ultraschall misst nicht”, “Ultraschall Füllstand hoch”, “Ultraschall bald nachfüllen”, texts as in the list, and drag them onto the page. Each one gets exactly one connection."
S7 = "Place the remaining blocks via the block search (F5), parameters as in the list, and connect them from top to bottom. OR and AND have two inputs each. Status inputs from V4 on only appear after a click on the “+” of the block – “Ultraschall Sensor” (#22) needs V5, “Ultraschall Verbrauch” (#34) V4. The rows of the status blocks (#12, #22, #34) are in the Parameters column and are entered by hand, in the given order, the one without condition last. Take over the formulas #14, #33 and #37 exactly. “Pulse at” #15 stays at 00:00:00, set #31 to 23:59:00."
S8 = "Your own pump (if present): connect output Q of “Trockenlaufschutz Pumpe” (#30) to the lock input of the pump (e.g. input “Off” of the Irrigation block, or an AND in front of the pump output, negated there). Without a pump Q stays free. Connect it only after the calibration (step 1) – without it the fill level stays at −1 and the pump would remain locked."
S9 = "Save and transfer. Check: %s counts on with every run (every minute by default); the status “Ultraschall Sensor” shows “misst – Abstand … cm”; in the plugin tab %s → %s – the same distance as in Loxone."
H_VERBRAUCH = "“Verbrauch heute” becomes negative when more flows in than is consumed (rain, filling). “Reicht noch” only calculates with a consumption of yesterday above 0; otherwise it shows 999 and no notification comes."
H_TAKT = "If you change %s in the plugin: set Tmc on #19 to five times the new interval."
H_ZU19 = "<b>On #19:</b> Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers. Min is 0: the sign of life knows no −1."
H_AUSFALL = "“Ultraschall ausgefallen” (#11) comes when the service has crashed or been stopped and when no sign of life arrives any more (LoxBerry, MQTT gateway or service stands still) – at the earliest after 300 s + 1800 s. A switched-off plugin instead reports “Sensor misst nicht: Plugin ausgeschaltet” (#22)."
B37_TYP = "Formula"
B37_NAME = "Messung gültig und kalibriert"
B37_PARAM = "IF(I1&gt;0;IF(I2&gt;=0;1;0);0) – 1 only with a usable measurement AND a known fill level; -1 (not calibrated, no measurement yet) gives 0"
B37_VERB = "I1 = #3, I2 = #1"
H_MINUS1 = "<b>−1 = no statement:</b> not calibrated, no total volume, or no usable measurement since the start. The dry-run protection (#30) then locks – the safe direction; #14 and #33 do not calculate with −1 (0 or 999). A single invalid measurement leaves the last value, only valid goes to 0."
H_ENDPUNKT = "This page uses the MQTT gateway, not the HTTP endpoint – a new action token or a switched-off endpoint changes nothing here."

