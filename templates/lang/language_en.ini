FORM_HINWEIS = "With a horizontal cylinder or a sphere, “empty” must be the distance to the lowest point (bottom) and “full” the distance to the highest point (top); total volume is the content up to the top. If you measure “full” at a lower overflow edge, the percentages will be wrong. Percent and litres are then the share of the volume; the height is still in the distance."
