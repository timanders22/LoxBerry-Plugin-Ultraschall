[THEMA_LANG]
DISTANCE = "Distance from the sensor to the surface, in centimetres; −1 as long as no usable measurement has arrived since the start."
LAST_ERROR = "Last error message, otherwise empty; “Plugin ausgeschaltet” when the plugin is not switched on. Create it in Loxone as a <b>virtual text input</b>, name as in the table."
LEVEL = "Fill level in percent (with a horizontal cylinder or sphere the share of the volume) — without calibration −1 (no statement)."
LITER = "Content in litres — without calibration or without total volume −1 (no statement)."
ONLINE = "1 as long as the service runs. It sends it with every measuring run; if the process dies, the broker sets it to 0 via the stored last will, when stopped the service sends the 0 itself. The only retained topic. <b>Not</b> to be confused with <span class='sm-mono'>OK</span> and <span class='sm-mono'>ONLINE</span> in the response line of the endpoint – the endpoint calculates those from the age of the last measurement."
TS = "Time of the last <b>successful</b> measurement as Unix time, 0 = never (existing installations). Do not use it for an age calculation in Loxone (local time) – whether the service is alive is told by the sign of life <span class='sm-mono'>status/zaehler</span>."
VALID = "1 if the last run gave a usable value, otherwise 0 – also with the plugin switched off. With 0 the measurements stay at the last usable value."
ZAEHLER = "Advances by one on every cycle, 0 to 999, then starts over. A block watching for <i>unchanged for N minutes</i> detects a stalled service this way — even if the clock of the machine jumps. Over MQTT the first value sent is 0; the −1 for <i>never run yet</i> only appears in the endpoint response line, and only while there is no state file."
STATUS_ZAEHLER = "Sign of life in house form: counts on by one with every run of the plugin, 0 to 999, wraps around – even when the sensor is not measuring or the plugin is switched off, as long as the service runs. The failure detection hangs on it (step&nbsp;5)."
STATUS_OK = "1 = the last run gave a usable measurement, 0 = not (also: plugin switched off), −1 = no run yet since the service started. Says the same as <span class='sm-mono'>valid</span>; not used in the sample project – if you use it, set “Noncached”."
STATUS_TS = "Unix time of the last run. Do not use it for an age calculation in Loxone (local time)."

