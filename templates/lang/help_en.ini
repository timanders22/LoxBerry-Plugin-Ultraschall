; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Ultrasonic distance"
K02 = "The plugin measures the distance to a surface with an ultrasonic sensor and reports it to the Miniserver. If two calibration points are entered, it additionally converts the distance into a fill level in per cent and — if a total volume is given — into litres. Typical use: a cistern, rainwater tank, heating oil tank or feed silo."
K03 = "Supported sensors"
K04 = "Setting up in four steps"
K05 = "<b>Connect the sensor.</b> The SRF02 goes on the I2C bus, the HC-SR04 on two free GPIO pins. I2C is switched on during installation; a restart is needed afterwards if it was off before."
K06 = "<b>Settings tab:</b> choose the type, switch the plugin on, save."
K07 = "<b>Test tab:</b> press <i>Measure now</i>. If a plausible value comes out, the wiring is right. If nothing comes, <i>Check sensor</i> helps."
K08 = "<b>Loxone integration tab:</b> download the template, import it into Loxone Config with <i>Paste template</i>, then connect the inputs to the MQTT gateway."
K09 = "Calibrating the fill level"
K10 = "Two values are enough: the distance measured with the container empty and the one with it full. Both can be measured directly — the two buttons at the bottom of the Settings tab copy the value just measured into the respective field."
K11 = "If the sensor sits in the lid at the top, the distance with the container empty is the larger one. But the plugin also copes with the opposite arrangement; it simply interpolates linearly between the two points."
K12 = "The <i>total volume</i> field is optional. It is only reliable with vertical walls: with a horizontal cylinder or a sphere the relationship between fill height and contents is not linear."
K13 = "Why several measurements are taken"
K14 = "Ultrasonic sensors occasionally deliver nonsense — an echo from the container wall, a swallowed echo, a reverberation of the previous measurement. The plugin therefore measures several times in a row and takes the <b>median</b>, that is, the middle one of the sorted values. Unlike an average, a single outlier does not drag the result with it."
K15 = "There is also a plausibility range: values outside the <i>smallest</i> and <i>largest plausible value</i> are not considered at all. If no value is left after that, the plugin reports <code>valid = 0</code> instead of an invented number."
K16 = "What goes to the Miniserver"
K17 = "All topics are <b>retained</b>: the broker remembers the last value. After a restart of the Miniserver the distance is there again immediately."
K18 = "UDP"
K19 = "The original version sent the distance as a bare number to the Miniserver over UDP. That route can still be used — but it is only meant for existing configurations. In Loxone Config it needs a virtual UDP input with the command recognition <code>\v</code>. Over UDP only the distance is ever sent, never the fill level or litres, and the value does not survive a restart of the Miniserver."
K20 = "Limits of the method"
K21 = "Ultrasound needs a flat, preferably hard, horizontal surface. Foam, textiles and bulk material lying at an angle scatter the sound instead of reflecting it."
K22 = "If the sensor sits in a narrow pipe, echoes from the pipe wall come along."
K23 = "The speed of sound depends on temperature: about 0.17&nbsp;% per degree. Between a winter night and a summer day that is easily 5&nbsp;% — so about 10&nbsp;cm at 200&nbsp;cm. Neither the SRF02 nor the HC-SR04 compensates for it."
K24 = "Directly in front of the sensor there is a dead zone in which it measures nothing. On the SRF02 that is about 16&nbsp;cm."
K25 = "If nothing arrives"
K26 = "<b>Test tab → Service state:</b> is it running at all, and is the plugin switched on?"
K27 = "<b>Test tab → Check sensor:</b> with the SRF02, <code>i2cdetect</code> shows whether the address is occupied. If nothing is there, the wiring is wrong or I2C is not switched on."
K28 = "<b>Log files tab:</b> the reason is there in plain words."
K29 = "Origin"
K30 = "The basis is the plugin <i>Ultraschall Entfernung</i> by Dietmar Wimmer (version 0.30, 2015). The author entry in <code>plugin.cfg</code> stays unchanged — LoxBerry identifies a plugin by it."
K31 = "The original version was written for plugin interface 1.0 and could no longer be installed on LoxBerry 3 and 4 at all. Everything else that was changed is described in <code>README.md</code> in the plugin folder."
