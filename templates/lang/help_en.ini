K36 = "SRF02 (also SRF08, SRF10)"
K37 = "I2C, address 0x70 from the factory"
K38 = "about 16 cm to 6 m"
K39 = "3.3&nbsp;V compatible, can be connected directly. Converts the travel time itself."
K40 = "HC-SR04"
K41 = "two GPIO pins (trigger, echo)"
K42 = "about 2 cm to 4 m"
K43 = "<b>5&nbsp;V.</b> The echo pin has to go through a voltage divider to 3.3&nbsp;V, otherwise the Raspberry Pi is damaged over time."
