; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Ultraschall Entfernung"
K02 = "Das Plugin misst mit einem Ultraschallsensor den Abstand zu einer Fläche und meldet ihn an den Miniserver. Sind zwei Kalibrierpunkte eingetragen, rechnet es den Abstand zusätzlich in einen Füllstand in Prozent und — bei angegebenem Gesamtvolumen — in Liter um. Typischer Einsatz: Zisterne, Regenwassertank, Heizöltank, Futtersilo."
K03 = "Unterstützte Sensoren"
K04 = "Einrichtung in vier Schritten"
K05 = "<b>Sensor anschließen.</b> Beim SRF02 an den I2C-Bus, beim HC-SR04 an zwei freie GPIO-Pins. I2C wird bei der Installation eingeschaltet; danach ist ein Neustart nötig, falls es vorher aus war."
K06 = "<b>Reiter Einstellungen:</b> Bauart wählen, Plugin einschalten, speichern."
K07 = "<b>Reiter Test:</b> <i>Jetzt messen</i> drücken. Kommt ein plausibler Wert heraus, stimmt die Verkabelung. Kommt nichts, hilft <i>Sensor prüfen</i> weiter."
K08 = "<b>Reiter Einbindung in Loxone:</b> Vorlage herunterladen und in Loxone Config über <i>Vorlage einfügen</i> einlesen, dann die Eingänge mit dem MQTT-Gateway verbinden."
K09 = "Füllstand kalibrieren"
K10 = "Zwei Werte genügen: der gemessene Abstand bei leerem Behälter und der bei vollem. Beide lassen sich direkt messen — die beiden Knöpfe unten im Reiter Einstellungen übernehmen den gerade gemessenen Wert in das jeweilige Feld."
K11 = "Sitzt der Sensor oben im Deckel, ist der Abstand bei leerem Behälter der größere. Das Plugin kommt aber auch mit der umgekehrten Anordnung zurecht; es rechnet einfach zwischen den beiden Punkten linear um."
K12 = "Das Feld <i>Gesamtvolumen</i> ist optional. Es ist nur bei senkrechten Wänden verlässlich: bei einem liegenden Zylinder oder einer Kugel ist der Zusammenhang zwischen Füllhöhe und Inhalt nicht linear."
K13 = "Warum mehrfach gemessen wird"
K14 = "Ultraschallsensoren liefern gelegentlich Unsinn — ein Echo von der Behälterwand, ein verschlucktes Echo, ein Nachhall der vorigen Messung. Das Plugin misst deshalb mehrmals hintereinander und nimmt den <b>Median</b>, also den mittleren der sortierten Werte. Anders als beim Mittelwert zieht ein einzelner Ausreißer das Ergebnis dabei nicht mit."
K15 = "Zusätzlich gibt es einen Plausibilitätsbereich: Werte außerhalb von <i>kleinster</i> und <i>größter plausibler Wert</i> werden gar nicht erst berücksichtigt. Bleibt danach kein einziger Wert übrig, meldet das Plugin <code>valid = 0</code> statt einer erfundenen Zahl."
K16 = "Was an den Miniserver geht"
K17 = "Alle Themen sind <b>retained</b>: der Broker merkt sich den letzten Wert. Nach einem Neustart des Miniservers steht die Entfernung sofort wieder da."
K18 = "UDP"
K19 = "Die Originalfassung schickte die Entfernung als blanke Zahl per UDP an den Miniserver. Dieser Weg lässt sich weiter benutzen — er ist aber nur für bestehende Konfigurationen gedacht. In Loxone Config braucht es dafür einen virtuellen UDP-Eingang mit der Befehlserkennung <code>\v</code>. Über UDP geht immer nur die Entfernung, nie Füllstand oder Liter, und der Wert überlebt keinen Neustart des Miniservers."
K20 = "Grenzen des Verfahrens"
K21 = "Ultraschall braucht eine ebene, möglichst harte, waagrechte Fläche. Schaum, Textilien und schräg liegendes Schüttgut streuen den Schall, statt ihn zurückzuwerfen."
K22 = "Sitzt der Sensor in einem engen Rohr, kommen Echos von der Rohrwand mit."
K23 = "Die Schallgeschwindigkeit hängt von der Temperatur ab: rund 0,17&nbsp;% je Grad. Zwischen Winternacht und Sommertag sind das leicht 5&nbsp;% — bei 200&nbsp;cm also etwa 10&nbsp;cm. Weder der SRF02 noch der HC-SR04 gleichen das aus."
K24 = "Direkt vor dem Sensor gibt es eine tote Zone, in der er nichts misst. Beim SRF02 sind das rund 16&nbsp;cm."
K25 = "Wenn nichts kommt"
K26 = "<b>Reiter Test → Zustand des Dienstes:</b> läuft er überhaupt, und ist das Plugin eingeschaltet?"
K27 = "<b>Reiter Test → Sensor prüfen:</b> beim SRF02 zeigt <code>i2cdetect</code>, ob die Adresse belegt ist. Steht dort nichts, stimmt die Verkabelung nicht oder I2C ist nicht eingeschaltet."
K28 = "<b>Reiter Logdateien:</b> dort steht die Ursache im Klartext."
K29 = "Herkunft"
K30 = "Grundlage ist das Plugin <i>Ultraschall Entfernung</i> von Dietmar Wimmer (Version 0.30, 2015). Die Autorenangabe in <code>plugin.cfg</code> bleibt unverändert — LoxBerry identifiziert ein Plugin darüber."
K31 = "Die Originalfassung war auf Plugin-Schnittstelle 1.0 ausgelegt und ließ sich auf LoxBerry 3 und 4 gar nicht mehr installieren. Was sonst noch geändert wurde, steht in der Datei <code>README.md</code> im Plugin-Ordner."
