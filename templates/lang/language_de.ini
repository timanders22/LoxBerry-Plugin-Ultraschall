TYP_VI = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Ultraschall)"
S1 = "Im Plugin Reiter %s Sensor wählen, %s setzen und speichern. Dann kalibrieren: bei leerem Behälter %s drücken, bei vollem %s (oder beide Abstände in cm eintragen) und %s eintragen, speichern. Ohne Kalibrierung senden Füllstand und Liter −1 (keine Aussage) – dann wirken nur Abstand, Sensor- und Ausfallmeldung, und der Trockenlaufschutz sperrt. Reiter %s → %s: ein plausibler Abstand muss kommen."
S2 = "LoxBerry → MQTT Gateway: Fassung 1 – das Abo %s eintragen (steht oben in Schritt&nbsp;2). Fassung 2 – in den Subscriptions unter %s die sieben Datenpunkte aus Schritt&nbsp;2 anhaken, valid und online mit „Noncached“."
S3 = "Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Namen genau wie in der Namenstabelle (Schritt&nbsp;3): %s, %s, %s, %s, %s und %s. „Als Digitaleingang verwenden“ nicht anhaken. Eine Vorlage zum Einlesen gibt es dafür nicht."
S4 = "Virtuellen Texteingang anlegen: Peripherie → Virtuelle Eingänge → Virtueller Texteingang, Name genau so: %s, „In Visualisierung verwenden“ an."
S5 = "Seite „Ultraschall“ anlegen, die sechs Eingänge, den Texteingang und eine Konstante mit Wert 1 auf die Seite ziehen. Bei %s und %s im Eigenschaftsfenster „Statistik“ einschalten."
S6 = "Fünf Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Füllstand niedrig“, „Ultraschall ausgefallen“, „Ultraschall misst nicht“, „Ultraschall Füllstand hoch“, „Ultraschall bald nachfüllen“, Texte wie in der Liste, auf die Seite ziehen. Jede bekommt genau eine Leitung."
S7 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. ODER und UND haben je zwei Eingänge. Status-Eingänge ab V4 erscheinen erst nach Klick auf das „+“ am Baustein – „Ultraschall Sensor“ (#22) braucht V5, „Ultraschall Verbrauch“ (#34) V4. Die Zeilen der Status-Bausteine (#12, #22, #34) stehen in der Spalte Parameter und werden von Hand eingetragen, in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. Die Formeln #14, #33 und #37 genau so übernehmen. „Impuls um“ #15 bleibt auf 00:00:00, #31 auf 23:59:00 stellen."
S8 = "Eigene Pumpe (wenn vorhanden): Ausgang Q von „Trockenlaufschutz Pumpe“ (#30) an den Sperreingang der Pumpe legen (z. B. Eingang „Off“ des Bausteins Bewässerung oder ein UND vor dem Pumpenausgang, dort negiert). Ohne Pumpe bleibt Q frei. Erst nach der Kalibrierung (Schritt 1) anschließen – ohne sie steht der Füllstand auf −1, und die Pumpe bliebe gesperrt."
S9 = "Speichern und übertragen. Probe: %s zählt bei jedem Lauf weiter (ab Werk jede Minute); Status „Ultraschall Sensor“ zeigt „misst – Abstand … cm“; im Plugin Reiter %s → %s – derselbe Abstand wie in Loxone."
H_VERBRAUCH = "„Verbrauch heute“ wird negativ, wenn mehr zuläuft als verbraucht wird (Regen, Befüllung). „Reicht noch“ rechnet nur mit einem Verbrauch von gestern über 0; sonst steht 999 da und es kommt keine Meldung."
H_TAKT = "Wer %s im Plugin ändert: Tmc an #19 auf das Fünffache des neuen Takts setzen."
H_ZU19 = "<b>Zu #19:</b> Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus. Min ist 0: das Lebenszeichen kennt kein −1."
H_AUSFALL = "„Ultraschall ausgefallen“ (#11) kommt bei abgestürztem oder angehaltenem Dienst und wenn kein Lebenszeichen mehr kommt (LoxBerry, MQTT-Gateway oder Dienst steht) – frühestens nach 300 s + 1800 s. Ein ausgeschaltetes Plugin meldet dagegen „Sensor misst nicht: Plugin ausgeschaltet“ (#22)."
B37_TYP = "Formel"
B37_NAME = "Messung gültig und kalibriert"
B37_PARAM = "IF(I1&gt;0;IF(I2&gt;=0;1;0);0) – 1 nur bei brauchbarer Messung UND bekanntem Füllstand; -1 (nicht kalibriert, noch keine Messung) gibt 0"
B37_VERB = "I1 = #3, I2 = #1"
H_MINUS1 = "<b>−1 = keine Aussage:</b> nicht kalibriert, kein Gesamtvolumen oder seit dem Start noch keine brauchbare Messung. Der Trockenlaufschutz (#30) sperrt dann – die sichere Richtung; #14 und #33 rechnen mit −1 nicht (0 bzw. 999). Eine einzelne ungültige Messung lässt den letzten Wert stehen, nur valid geht auf 0."
H_ENDPUNKT = "Diese Seite nutzt das MQTT-Gateway, nicht den HTTP-Endpunkt – ein neues Aktionstoken oder ein ausgeschalteter Endpunkt ändert hier nichts."

